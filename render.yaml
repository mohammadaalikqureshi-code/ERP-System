databases:
  - name: medicare-db
    databaseName: clinic_erp
    user: postgres
    plan: free
    region: singapore

services:
  - type: web
    name: medicare-erp-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        value: 'gAAAAABn-placeholderkeyforproductionfernetencryption12345='
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: COOKIE_SAMESITE
        value: 'none'

  - type: web
    name: medicare-erp-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medicare-erp-api
          property: host
