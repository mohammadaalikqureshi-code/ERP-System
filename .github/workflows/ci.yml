name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint needs these to render the PDF documents.
      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info fonts-dejavu-core

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest

      - name: Check migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clinic_erp_test
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d clinic_erp_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
          alembic upgrade head

      - name: Seed and smoke-test the API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clinic_erp_test
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          SECRET_KEY: ci-secret-key-for-the-pipeline-only-000000
          JWT_SECRET_KEY: ci-jwt-secret-key-for-the-pipeline-only-0
          JWT_REFRESH_SECRET_KEY: ci-refresh-secret-for-the-pipeline-only
        run: |
          python -m scripts.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          # Signing in must work end to end.
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email_or_phone":"priya.menon@sanjeevanihospital.in","password":"Medicare@2026"}' \
            | grep -q access_token

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
